// Local Expo module (autolinked from apps/mobile/modules). The Recording API on
// mobile lives in play-services-fitness 21.2.0+; it records steps on the phone
// itself, with no Google account and no network.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.koydumsteps'
version = '1.0.0'

android {
  namespace "expo.modules.koydumsteps"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "com.google.android.gms:play-services-fitness:21.3.0"
}
