name: Preview APK

on:
  push:
    branches:
      - claude/therapeutic-game-design-BAr6E
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pinned to 3.24.3 — isar_generator 3.1.0+1 is no longer maintained
  # and the analyzer ships with Flutter 3.26+ breaks its element-model
  # assumptions. 3.24.3 is the last Flutter release verified to work
  # with Isar 3 end-to-end.
  FLUTTER_VERSION: '3.24.3'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate platform directories (android/)
        run: |
          # `flutter create` is idempotent and only adds missing
          # platform scaffolding. lib/ and pubspec.yaml stay intact.
          flutter create . \
            --platforms=android \
            --org tr.ergoterapi \
            --project-name ergoterapi \
            --description "Ergoterapi ADL oyun uygulamasi"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Patch isar_flutter_libs for AGP 8 namespace requirement
        run: |
          set -e
          # isar_flutter_libs 3.x is no longer maintained and ships
          # without a `namespace` declaration, which AGP 8+ (bundled
          # with Flutter 3.24+) rejects. We inject it into the cached
          # copy before the Gradle build reads it.
          ISAR_DIR=$(find "$HOME/.pub-cache/hosted/pub.dev" \
            -maxdepth 1 -type d -name "isar_flutter_libs-*" | head -1)
          if [ -z "$ISAR_DIR" ]; then
            echo "::error::isar_flutter_libs not found in pub cache"
            exit 1
          fi
          BG="$ISAR_DIR/android/build.gradle"
          if grep -q 'namespace' "$BG"; then
            echo "Already patched: $BG"
          else
            sed -i '/^android {/a\    namespace "dev.isar.isar_flutter_libs"' "$BG"
            echo "Patched $BG"
            grep -n 'namespace\|^android' "$BG" | head -5
          fi

      - name: Generate Isar code (verbose)
        run: |
          set -e
          # Capture full output so we can grep warnings on failure.
          dart run build_runner build \
            --delete-conflicting-outputs --verbose 2>&1 \
            | tee build_runner.log | tail -120
          echo ""
          echo "=== Generated .g.dart files ==="
          find lib -name "*.g.dart" -printf "%p (%s bytes)\n" | sort

      - name: Fail fast if ScheduleEntry generator output is missing
        run: |
          set -e
          F=lib/features/progress/domain/schedule_entry.g.dart
          if [ ! -f "$F" ]; then
            echo "::error::$F was NOT generated."
            echo "--- last 40 lines of build_runner.log ---"
            tail -40 build_runner.log
            echo "--- grep for 'schedule_entry' in build_runner.log ---"
            grep -n 'schedule_entry\|ScheduleEntry' build_runner.log || true
            exit 1
          fi
          if ! grep -q 'scheduleEntries' "$F"; then
            echo "::error::$F exists but does not declare 'scheduleEntries' extension."
            head -60 "$F"
            exit 1
          fi
          echo "OK — schedule_entry.g.dart is present and has scheduleEntries extension."

      - name: Build debug APK (signed with debug key, installable)
        run: |
          # No --dart-define values passed → BuildConfig.cloudEnabled
          # is false, app runs in local-only mode. Perfect for preview:
          # no Supabase, no weekly report, full local gameplay.
          flutter build apk --debug

      - name: Stage APK with friendly name
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk \
            "artifacts/ergoterapi-preview-${GITHUB_SHA::7}.apk"
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: ergoterapi-preview-apk
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Publish / update Preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          name: Önizleme APK (en son)
          body: |
            Ergoterapi MCI uygulamasının en son önizleme APK'sı.

            **Telefona kurulum:**
            1. Aşağıdaki APK dosyasını Android telefonuna indir.
            2. İlk kurulumda Android `Bilinmeyen kaynaklara izin ver`
               diye soracak; izin ver.
            3. Yükle, aç. Profil oluşturmanı isteyecek.

            Bu önizleme tamamen yerel çalışır — bulut senkronu ve
            terapiste rapor gönderimi devre dışıdır (gerçek dağıtımda
            Supabase + e-posta yapılandırması ile etkinleşir).

            Commit: `${{ github.sha }}`
          files: artifacts/*.apk
          prerelease: true
          make_latest: false
