name: ergoterapi
description: Ergoterapi teorileri üzerine inşa edilmiş, hafif bilişsel bozukluk
  (MCI) olan hastalar için tablette oynanan ADL oyun uygulaması.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Local DB (Isar 3 stable)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # Audio
  just_audio: ^0.9.38

  # Cloud (Supabase)
  supabase_flutter: ^2.5.6

  # UUID for profile_id
  uuid: ^4.4.0

  # Date formatting (Turkish). Widened range because flutter_localizations
  # pins intl differently per Flutter version: 3.27 bundles 0.19.x, 3.29+
  # bundles 0.20.2. The pub resolver picks whichever is needed for the
  # installed SDK, so we just need to allow both.
  intl: '>=0.19.0 <0.22.0'

  # Elderly-friendly text sizing: wrap over multiple lines first, only
  # scale the font down if wrapping still doesn't fit. Plain Text +
  # FittedBox either shrinks immediately (unreadable) or clips; this
  # package encodes the graceful-degradation policy we want.
  auto_size_text: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.11
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true

  assets:
    - assets/scenes/
    - assets/scenes/bonus/
    - assets/images/scenes/sabah/
    - assets/images/scenes/oglen/
    - assets/images/scenes/ikindi/
    - assets/images/scenes/aksam/
    - assets/images/scenes/bonus/
    - assets/images/distractors/
    - assets/audio/
    - assets/audio/labels/
    - assets/audio/instructions/
