name: ergoterapi
description: Ergoterapi teorileri üzerine inşa edilmiş, hafif bilişsel bozukluk
  (MCI) olan hastalar için tablette oynanan ADL oyun uygulaması.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Local DB (Isar 3 stable)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # Audio
  just_audio: ^0.9.38

  # Cloud (Supabase)
  supabase_flutter: ^2.5.6

  # UUID for profile_id
  uuid: ^4.4.0

  # Date formatting (Turkish)
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.11
  isar_generator: ^3.1.0+1

# Pin `app_links` to 5.x. supabase_flutter 2.5.x transitively pulls
# in app_links 6.x, whose Android plugin uses Flutter's modern Gradle
# extension that only ships with Flutter 3.27+. We're pinned to 3.24.3
# (isar_generator 3.x is incompatible with Flutter 3.26+'s analyzer),
# so 6.x fails to configure. 5.x uses the traditional plugin style and
# works with 3.24. app_links is not exercised at runtime in the
# preview build (no Supabase auth flow, no deeplinks) — the override
# is purely a compile-time compatibility shim.
dependency_overrides:
  app_links: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/scenes/
    - assets/images/scenes/sabah/
    - assets/images/scenes/oglen/
    - assets/images/scenes/ikindi/
    - assets/images/scenes/aksam/
    - assets/images/distractors/
    - assets/audio/
    - assets/audio/labels/
    - assets/audio/instructions/
