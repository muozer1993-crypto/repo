services:
  koydum:
    build: .
    ports:
      - "4000:4000"
    environment:
      # Leave empty to build invite and download links from the address each
      # request came in on (right at home and through a tunnel alike); set it
      # when the server has one fixed public address, e.g. https://koydum.example.com
      PUBLIC_URL: ${PUBLIC_URL:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - koydum-data:/data
    restart: unless-stopped

volumes:
  koydum-data:
